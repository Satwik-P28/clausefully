name: Feature request
description: Propose a focused improvement
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: user-problem
    attributes:
      label: User problem
      description: Who encounters it, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or validation metric
      description: Link public evidence when making comparative claims.
