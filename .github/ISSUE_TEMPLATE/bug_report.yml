name: Bug report
description: Report a reproducible GentleEdit problem
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste API keys or sensitive writing. Use a harmless minimal example.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what occurred.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Demo, OpenAI, Anthropic, Not provider-related]
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
